nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: ['*'] 
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'X-AUTH-TOKEN']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/api/extension-pairing/exchange$':
            origin_regex: false
            allow_origin: ['%env(EXTENSION_ORIGIN)%']
            allow_methods: ['POST', 'OPTIONS']
            allow_headers: ['Content-Type', 'X-Extension-Client-Id', 'X-Extension-Version', 'X-Extension-Manifest-Version', 'X-Device-Label', 'X-Browser-Name', 'X-Browser-Version', 'X-OS-Name', 'X-OS-Version', 'X-Extension-Origin']
            max_age: 600
        '^/': null
