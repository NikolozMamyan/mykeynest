# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    uploads_avatar: '%kernel.project_dir%/public/uploads/avatars'
    article_covers_dir: '%kernel.project_dir%/public/uploads/blog'
    article_content_images_dir: '%kernel.project_dir%/public/uploads/blog/content'


services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\StripePlanCatalog:
        arguments:
            $teamMinimumSeats: '%env(int:STRIPE_TEAM_MIN_SEATS)%'
            $teamMaximumSeats: '%env(int:STRIPE_TEAM_MAX_SEATS)%'

    App\Service\StripeEnvironmentManager:
        arguments:
            $sandboxSecretKey: '%env(STRIPE_SANDBOX_SECRET_KEY)%'
            $sandboxProPriceId: '%env(STRIPE_SANDBOX_PRICE_PRO)%'
            $sandboxTeamPriceId: '%env(STRIPE_SANDBOX_PRICE_TEAM)%'
            $sandboxWebhookSecret: '%env(STRIPE_SANDBOX_WEBHOOK_SECRET)%'
            $productionSecretKey: '%env(STRIPE_PRODUCTION_SECRET_KEY)%'
            $productionProPriceId: '%env(STRIPE_PRODUCTION_PRICE_PRO)%'
            $productionTeamPriceId: '%env(STRIPE_PRODUCTION_PRICE_TEAM)%'
            $productionWebhookSecret: '%env(STRIPE_PRODUCTION_WEBHOOK_SECRET)%'

    App\Service\StripeBillingService:
        arguments:
            $appUrl: '%env(APP_URL)%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
